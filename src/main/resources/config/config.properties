# Base URL Configuration
base.url=https://fakestoreapi.com

# API Endpoints
api.login=/auth/login
api.products=/products
api.carts=/carts
api.users=/users

# Request Timeout (milliseconds)
request.timeout=30000

# Retry Configuration
retry.count=3

# Reporting
report.path=test-output/ExtentReports/
report.name=FakeStoreAPI_TestReport

# Test Data
testdata.path=src/main/resources/testdata/combineTestData.xlsx

# Logging
log.level=INFO
log.path=src/logs/application.log